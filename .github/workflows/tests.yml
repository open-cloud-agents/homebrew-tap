name: Brew Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-formula:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Test Formula Installation
        run: |
          brew install --verbose --build-from-source open-cloud-agents/tap/ocagents
          ocagents info
          ocagents list
          brew test open-cloud-agents/tap/ocagents
